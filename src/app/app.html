<a class="skip-link" href="#obsah">Přeskočit na obsah</a>
<header class="topbar">
  <div class="topbar-left">
    <a class="brand" routerLink="/mapa">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <circle cx="15" cy="15" r="14" fill="#E8632B" />
        <path d="M22 15 L11 9 L13 15 L11 21 Z" fill="#FFFFFF" />
      </svg>
      <span>Turtle Academy</span>
    </a>
    <nav aria-label="Hlavní">
      <a routerLink="/mapa" routerLinkActive="active" ariaCurrentWhenActive="page">Mapa</a>
    </nav>
  </div>
  <div class="topbar-right">
    <div class="streak">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#FFB27A"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M12 2c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-7 2 1 3 3 3 5" />
      </svg>
      <span><b>{{ progress.streak() }}</b> {{ streakDays() }} v řadě</span>
    </div>
    <div class="level">
      <span class="level-badge">Lvl {{ progress.playerLevel().level }}</span>
      <div class="xp">
        <div
          class="xp-bar"
          role="progressbar"
          aria-label="XP do další úrovně"
          [attr.aria-valuenow]="levelProgress()"
          aria-valuemin="0"
          aria-valuemax="100"
        >
          <div class="xp-fill" [style.width.%]="levelProgress()"></div>
        </div>
        <div class="xp-text">{{ progress.xp() }} / {{ progress.playerLevel().to }} XP</div>
      </div>
    </div>
    @if (firebaseEnabled) {
      <app-account-menu />
    }
  </div>
</header>
<main id="obsah">
  <router-outlet />
</main>
