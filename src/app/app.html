<a class="skip-link" href="#obsah">Přeskočit na obsah</a>
<header class="topbar">
  <div class="topbar-left">
    <a class="brand" routerLink="/mapa">
      <svg width="38" height="38" viewBox="10 8 100 102" aria-hidden="true">
        <path d="M26 108 Q34 92 60 90" fill="none" stroke="#E8632B" stroke-width="5" stroke-dasharray="7 6" stroke-linecap="round" />
        <g fill="#7CC77F">
          <circle cx="36" cy="42" r="9" />
          <circle cx="84" cy="42" r="9" />
          <circle cx="36" cy="82" r="9" />
          <circle cx="84" cy="82" r="9" />
          <circle cx="60" cy="20" r="11" />
        </g>
        <ellipse cx="60" cy="62" rx="28" ry="32" fill="#E8632B" />
        <g fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round">
          <polygon points="60,52 69,57 69,67 60,72 51,67 51,57" />
          <path d="M60 52 L60 32 M69 57 L84 50 M69 67 L84 74 M60 72 L60 92 M51 67 L36 74 M51 57 L36 50" />
        </g>
      </svg>
      <span>Turtle Academy</span>
    </a>
    <nav aria-label="Hlavní">
      <a routerLink="/mapa" routerLinkActive="active" ariaCurrentWhenActive="page">Mapa</a>
    </nav>
  </div>
  <div class="topbar-right">
    <div class="level">
      <span class="level-badge">Lvl {{ progress.playerLevel().level }}</span>
      <div class="xp">
        <div
          class="xp-bar"
          role="progressbar"
          aria-label="XP do další úrovně"
          [attr.aria-valuenow]="levelProgress()"
          aria-valuemin="0"
          aria-valuemax="100"
        >
          <div class="xp-fill" [style.width.%]="levelProgress()"></div>
        </div>
        <div class="xp-text">{{ progress.xp() }} / {{ progress.playerLevel().to }} XP</div>
      </div>
    </div>
    @if (firebaseEnabled) {
      <app-account-menu />
    }
  </div>
</header>
<main id="obsah">
  <router-outlet />
</main>
