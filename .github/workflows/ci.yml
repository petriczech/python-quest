name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx ng lint

      - name: Unit testy
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build

      - name: Playwright prohlížeč
        run: npx playwright install --with-deps chromium

      # Screenshot baseline jsou z Windows, na Linuxu se liší fonty
      - name: E2E
        run: npx playwright test --grep-invert "screenshot:"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
